# Example project with FICTIONAL transcripts, for trying the workflow end to end.
name: "Example: community savings groups"
description: "Fictional focus groups with members of a community savings group program."

context: >
  A fictional NGO runs savings groups of 15-25 members who meet weekly, save small
  amounts, and take small loans from the pooled fund. Focus groups were held with
  members in two villages after one year.

research_questions:
  - What helps or hinders members from saving regularly?
  - How do members use loans from the group?

transcript_language: en
transcripts_dir: transcripts
metadata_file: transcripts/metadata.csv
codebook_file: codebook.yaml
outputs_dir: outputs

segmentation:
  unit: question
  moderator_labels: [moderator, interviewer, facilitator]

tabular:
  speaker_column: speaker
  text_column: text

models:
  coding_model: claude-opus-5-5
  coding_effort: medium
  drafting_model: claude-opus-5-5
  drafting_effort: high
  embedding_model: voyage-4

prefilter:
  enabled: true
  top_k: 3
