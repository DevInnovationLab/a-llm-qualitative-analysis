[project]
name = "dilqual"
version = "0.1.0"
description = "Qualitative transcript analysis workflow with Claude and Voyage AI embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "voyageai>=0.6.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.3",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
qual = "dilqual.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dilqual"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
fix = true
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D", "UP", "SIM"]
ignore = [
    "W191", "E111", "E114", "E117", "D206", "D300", "E501",
    "D100", "D102", "D103", "D104", "D105", "D107", "D203", "D205", "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
